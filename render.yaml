# Render Blueprint: New > Blueprint > pick this repo.
services:
  - type: web
    name: sitespec-api
    runtime: docker
    plan: free
    # MUST be a US region: FEMA's flood-map server blocks non-US IP addresses.
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: RAPIDAPI_PROXY_SECRET
        sync: false   # Render asks you for the value; it never lives in git
      - key: CONTACT
        sync: false   # your email: identifies you to the government APIs we call
